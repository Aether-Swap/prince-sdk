name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack and verify imports
        run: |
          PACK_OUTPUT=$(npm pack)
          TEMP_DIR=$(mktemp -d ./temp-pack-verify-XXXXXX)
          cp "$PACK_OUTPUT" "$TEMP_DIR/"
          cd "$TEMP_DIR"
          npm init -y
          npm install "./$PACK_OUTPUT"
          node -e 'const pkg = require("@aether-swap/prince-sdk"); console.log("CJS require OK:", typeof pkg.PayoutRegistryClient);'
          node --input-type=module -e 'import { PayoutRegistryClient } from "@aether-swap/prince-sdk"; console.log("ESM import OK:", typeof PayoutRegistryClient);'
          cd ..
          rm -rf "$TEMP_DIR" "$PACK_OUTPUT"
